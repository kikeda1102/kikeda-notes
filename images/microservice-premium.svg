    <marker id="gr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#555"/></marker>
  </defs>
  <rect x="70" y="50" width="302" height="250" fill="#f1f3f4" opacity="0.6"/>
  <rect x="372" y="50" width="188" height="250" fill="#e8f0fe" opacity="0.6"/>
  <text x="221" y="290" text-anchor="middle" fill="#555">モノリスのほうが生産性が高い</text>
  <text x="466" y="116" text-anchor="middle" fill="#555">マイクロサービスのほうが高い</text>

  <line x1="70" y1="300" x2="570" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="70" y1="300" x2="70" y2="40" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ax)"/>
