  <text x="570" y="320" text-anchor="end" fill="#1a1a1a">システムの複雑さ</text>

  <path d="M80 90 C 250 100, 380 200, 540 290" fill="none" stroke="#b06000" stroke-width="3"/>
  <path d="M80 170 C 250 175, 400 190, 540 215" fill="none" stroke="#3367d6" stroke-width="3"/>
