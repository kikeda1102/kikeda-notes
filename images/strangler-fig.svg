<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="sans-serif" font-size="12">
  <rect width="780" height="300" fill="#ffffff"/>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1a1a1a"/></marker>
  </defs>
  <g stroke="#cccccc"><line x1="260" y1="15" x2="260" y2="285"/><line x1="520" y1="15" x2="520" y2="285"/></g>

  <!-- 共通: タイトルとルーティング -->
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">
    <text x="130" y="28">① 移行前</text><text x="390" y="28">② 移行中</text><text x="650" y="28">③ 移行後</text>
  </g>
  <g fill="#fef7e0" stroke="#b06000" stroke-width="2">
    <rect x="60" y="45" width="140" height="30" rx="6"/><rect x="320" y="45" width="140" height="30" rx="6"/><rect x="580" y="45" width="140" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1a1a1a">
    <text x="130" y="65">ルーティング</text><text x="390" y="65">ルーティング</text><text x="650" y="65">ルーティング</text>
  </g>

  <!-- ① 移行前 -->
  <rect x="30" y="120" width="200" height="110" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
  <text x="130" y="142" text-anchor="middle" font-weight="bold" fill="#1a1a1a">既存のモノリス</text>
  <g fill="#ffffff" stroke="#5f6368"><rect x="45" y="160" width="52" height="40" rx="4"/><rect x="104" y="160" width="52" height="40" rx="4"/><rect x="163" y="160" width="52" height="40" rx="4"/></g>
  <g text-anchor="middle" fill="#1a1a1a"><text x="71" y="185">注文</text><text x="130" y="185">決済</text><text x="189" y="185">在庫</text></g>
  <line x1="130" y1="75" x2="130" y2="117" stroke="#1a1a1a" stroke-width="2" marker-end="url(#b)"/>
  <text x="130" y="258" text-anchor="middle" fill="#555">すべてのリクエストが既存のシステムへ</text>

  <!-- ② 移行中 -->
  <rect x="280" y="120" width="140" height="110" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
  <text x="350" y="142" text-anchor="middle" font-weight="bold" fill="#1a1a1a">既存のモノリス</text>
  <g fill="#ffffff" stroke="#5f6368"><rect x="292" y="160" width="55" height="40" rx="4"/><rect x="353" y="160" width="55" height="40" rx="4"/></g>
  <g text-anchor="middle" fill="#1a1a1a"><text x="319" y="185">決済</text><text x="380" y="185">在庫</text></g>
  <rect x="435" y="150" width="70" height="60" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="2"/>
  <text x="470" y="177" text-anchor="middle" fill="#1a1a1a">注文</text>
  <text x="470" y="195" text-anchor="middle" font-size="10" fill="#3367d6">新サービス</text>
  <g stroke="#1a1a1a" stroke-width="2" marker-end="url(#b)">
    <line x1="365" y1="75" x2="355" y2="117"/>
    <line x1="420" y1="75" x2="465" y2="147"/>
  </g>
  <text x="452" y="108" fill="#3367d6" font-size="11">注文だけ</text>
  <text x="452" y="122" fill="#3367d6" font-size="11">新サービスへ</text>
  <text x="390" y="250" text-anchor="middle" fill="#555">安定したら、既存の注文の機能を削除する</text>
  <text x="390" y="268" text-anchor="middle" fill="#555">これを機能ごとに繰り返す</text>

  <!-- ③ 移行後 -->
  <rect x="540" y="120" width="220" height="110" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="650" y="225" text-anchor="middle" fill="#9aa0a6" font-size="11">既存のモノリスは削除済み</text>
  <g fill="#e8f0fe" stroke="#3367d6" stroke-width="2"><rect x="553" y="155" width="60" height="55" rx="8"/><rect x="620" y="155" width="60" height="55" rx="8"/><rect x="687" y="155" width="60" height="55" rx="8"/></g>
  <g text-anchor="middle" fill="#1a1a1a"><text x="583" y="187">注文</text><text x="650" y="187">決済</text><text x="717" y="187">在庫</text></g>
  <g stroke="#1a1a1a" stroke-width="2" marker-end="url(#b)">
    <line x1="620" y1="75" x2="588" y2="152"/><line x1="650" y1="75" x2="650" y2="152"/><line x1="680" y1="75" x2="712" y2="152"/>
  </g>
  <text x="650" y="258" text-anchor="middle" fill="#555">すべてのリクエストが新サービスへ</text>
</svg>
