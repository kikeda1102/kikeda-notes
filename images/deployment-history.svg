<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="sans-serif" font-size="12">
  <rect width="760" height="220" fill="#ffffff"/>
  <rect x="40" y="97" width="150" height="26" fill="#f1f3f4" stroke="#9aa0a6"/>
  <rect x="190" y="97" width="210" height="26" fill="#e8f0fe" stroke="#3367d6"/>
  <rect x="400" y="97" width="320" height="26" fill="#e6f4ea" stroke="#188038"/>
  <g text-anchor="middle" fill="#1a1a1a">
    <text x="115" y="114">モノリスが中心</text>
    <text x="295" y="114">マイクロサービスの普及</text>
    <text x="560" y="114">コストへの反省と、モジュラーモノリスへの注目</text>
  </g>

  <g fill="#1a1a1a" stroke="#ffffff" stroke-width="2">
    <circle cx="190" cy="97" r="5"/><circle cx="300" cy="123" r="5"/>
    <circle cx="410" cy="97" r="5"/><circle cx="610" cy="123" r="5"/>
  </g>
  <g stroke="#9aa0a6">
    <line x1="190" y1="78" x2="190" y2="92"/><line x1="300" y1="128" x2="300" y2="142"/>
    <line x1="410" y1="78" x2="410" y2="92"/><line x1="610" y1="128" x2="610" y2="142"/>
  </g>

  <g text-anchor="middle" fill="#1a1a1a">
    <text x="190" y="36" font-weight="bold">2011〜2012 年</text>
    <text x="190" y="54">Netflix などが実践し、</text>
    <text x="190" y="70">名前が議論される</text>

    <text x="300" y="158" font-weight="bold">2014 年</text>
    <text x="300" y="176">Lewis と Fowler が</text>
    <text x="300" y="192">マイクロサービスを定義</text>

    <text x="410" y="36" font-weight="bold">2015 年</text>
    <text x="410" y="54">Fowler がコストを指摘</text>
    <text x="410" y="70">（Microservice Premium）</text>

    <text x="610" y="158" font-weight="bold">2019 年</text>
    <text x="610" y="176">Shopify がモジュラーモノリス</text>
    <text x="610" y="192">への移行を公表</text>
  </g>
</svg>
