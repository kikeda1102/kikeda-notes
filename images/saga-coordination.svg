<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="sans-serif" font-size="13">
  <rect width="800" height="420" fill="#ffffff"/>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1a1a1a"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#188038"/></marker>
    <marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#777777"/></marker>
  </defs>
  <line x1="393" y1="20" x2="393" y2="350" stroke="#cccccc"/>

  <!-- コレオグラフィー -->
  <text x="195" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">コレオグラフィー（非同期）</text>
  <text x="195" y="50" text-anchor="middle" font-size="11" fill="#555">イベントを発行したら、応答を待たずに次の処理へ進む</text>
  <g fill="#e8f0fe" stroke="#3367d6" stroke-width="2">
    <rect x="12" y="66" width="76" height="30" rx="6"/>
    <rect x="227" y="66" width="76" height="30" rx="6"/>
    <rect x="307" y="66" width="76" height="30" rx="6"/>
  </g>
  <rect x="127" y="66" width="86" height="30" rx="6" fill="#fef7e0" stroke="#b06000" stroke-width="2"/>
  <g text-anchor="middle" fill="#1a1a1a">
    <text x="50" y="86">注文</text>
    <text x="170" y="86">ブローカー</text>
    <text x="265" y="86">決済</text>
    <text x="345" y="86">在庫</text>
  </g>
  <g stroke="#bbbbbb" stroke-dasharray="3 3">
    <line x1="50" y1="96" x2="50" y2="330"/><line x1="170" y1="96" x2="170" y2="330"/>
    <line x1="265" y1="96" x2="265" y2="330"/><line x1="345" y1="96" x2="345" y2="330"/>
  </g>
  <g stroke="#188038" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)">
    <line x1="50" y1="135" x2="167" y2="135"/>
    <line x1="170" y1="170" x2="262" y2="170"/>
    <line x1="265" y1="235" x2="173" y2="235"/>
    <line x1="170" y1="270" x2="342" y2="270"/>
  </g>
  <g font-size="11" fill="#188038" stroke="#ffffff" stroke-width="4" paint-order="stroke">
    <text x="56" y="128">「注文が作成された」</text>
    <text x="176" y="163">配信</text>
    <text x="259" y="228" text-anchor="end">「支払いが確定した」</text>
    <text x="176" y="263">配信</text>
  </g>
  <g font-size="11" fill="#1a1a1a" stroke="#ffffff" stroke-width="4" paint-order="stroke">
    <text x="56" y="160">発行したら</text>
    <text x="56" y="175">すぐ次の処理へ</text>
  </g>

  <!-- オーケストレーション -->
  <text x="597" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">オーケストレーション（同期の例）</text>
  <text x="597" y="50" text-anchor="middle" font-size="11" fill="#555">応答を待ってから、次のサービスに指示を出す</text>
  <rect x="405" y="66" width="120" height="30" rx="6" fill="#fef7e0" stroke="#b06000" stroke-width="2"/>
  <g fill="#e8f0fe" stroke="#3367d6" stroke-width="2">
    <rect x="537" y="66" width="76" height="30" rx="6"/>
    <rect x="627" y="66" width="76" height="30" rx="6"/>
    <rect x="712" y="66" width="76" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1a1a1a">
    <text x="465" y="86" font-size="12">オーケストレーター</text>
    <text x="575" y="86">注文</text>
    <text x="665" y="86">決済</text>
    <text x="750" y="86">在庫</text>
  </g>
  <g stroke="#bbbbbb" stroke-dasharray="3 3">
    <line x1="465" y1="96" x2="465" y2="330"/><line x1="575" y1="96" x2="575" y2="330"/>
    <line x1="665" y1="96" x2="665" y2="330"/><line x1="750" y1="96" x2="750" y2="330"/>
  </g>
  <rect x="459" y="120" width="12" height="190" fill="#fef7e0" stroke="#b06000"/>
  <g stroke="#1a1a1a" stroke-width="2" marker-end="url(#b)">
    <line x1="471" y1="135" x2="572" y2="135"/>
    <line x1="471" y1="205" x2="662" y2="205"/>
    <line x1="471" y1="275" x2="747" y2="275"/>
  </g>
  <g stroke="#777777" stroke-width="1.5" marker-end="url(#o)">
    <line x1="575" y1="160" x2="474" y2="160"/>
    <line x1="665" y1="230" x2="474" y2="230"/>
    <line x1="750" y1="300" x2="474" y2="300"/>
  </g>
  <g font-size="11" stroke="#ffffff" stroke-width="4" paint-order="stroke">
    <text x="478" y="128" fill="#1a1a1a">① 注文を作成</text>
    <text x="478" y="198" fill="#1a1a1a">② 支払いを確定</text>
    <text x="478" y="268" fill="#1a1a1a">③ 在庫を確保</text>
    <text x="478" y="155" fill="#777777">完了</text>
    <text x="478" y="225" fill="#777777">完了</text>
    <text x="478" y="295" fill="#777777">完了</text>
  </g>

  <!-- 凡例 -->
  <g font-size="11" fill="#1a1a1a">
    <line x1="30" y1="372" x2="80" y2="372" stroke="#188038" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
    <text x="90" y="376">非同期のメッセージ（応答を待たない）</text>
    <line x1="300" y1="372" x2="350" y2="372" stroke="#1a1a1a" stroke-width="2" marker-end="url(#b)"/>
    <text x="360" y="376">同期の呼び出し（応答を待つ）</text>
    <line x1="560" y1="372" x2="610" y2="372" stroke="#777777" stroke-width="1.5" marker-end="url(#o)"/>
    <text x="620" y="376">応答</text>
    <text x="30" y="402" fill="#555">オーケストレーションの指示は、メッセージキューで非同期に送ることもできる</text>
  </g>
</svg>
